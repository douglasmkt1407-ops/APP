<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D17" />
      <stop offset="100%" stop-color="#0F2238" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5A3" />
      <stop offset="100%" stop-color="#0084FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#grad)" stroke-width="8" stroke-opacity="0.5" />
  
  <!-- Heartbeat ECG line in background -->
  <path d="M 40 380 L 140 380 L 170 330 L 210 430 L 250 310 L 290 410 L 330 360 L 360 380 L 472 380" 
        fill="none" stroke="#00E5A3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  
  <!-- Center N+ emblem -->
  <g filter="url(#glow)">
    <!-- Letter N -->
    <path d="M 140 330 L 140 170 L 205 170 L 295 285 L 295 170 L 350 170 L 350 330 L 285 330 L 195 215 L 195 330 Z" 
          fill="url(#grad)" />
    <!-- Medical Plus Symbol (+) -->
    <path d="M 385 150 L 385 180 L 415 180 L 415 205 L 385 205 L 385 235 L 360 235 L 360 205 L 330 205 L 330 180 L 360 180 L 360 150 Z" 
          fill="#00E5A3" />
  </g>
</svg>
